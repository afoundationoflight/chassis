name: apk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      # THE STORES LIVE IN assets/ AND ARE COMMITTED.
      # An apk without them installs and refuses to boot, which is
      # correct behaviour and a waste of a download \u2014 so fail here,
      # where the reason is visible in a log rather than on a phone.
      - name: the stores must be present
        run: |
          cd app/src/main/assets
          missing=0
          for f in words.blob words.by_word words.by_id \
                   table3.btb table3.btb.idx; do
            if [ -f "$f" ]; then
              printf '  %-18s %s\n' "$f" "$(du -h "$f" | cut -f1)"
            else
              echo "::error::missing $f"; missing=1
            fi
          done
          [ "$missing" = "0" ] || exit 1

      - name: build
        run: |
          gradle wrapper --gradle-version 8.9 --no-daemon
          ./gradlew assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: chassis-apk
          path: app/build/outputs/apk/release/*.apk

      # A LINK RATHER THAN A LOGIN.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Chassis build ${{ github.run_number }}
          files: app/build/outputs/apk/release/*.apk
