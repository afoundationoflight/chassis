name: apk

on:
  push:
    paths: ['android/**', '.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      # THE STORES ARE BUILT ARTIFACTS, NOT SOURCE.
      # They are generated on the python side and live at the repo root,
      # so the workflow stages them into assets rather than the repo
      # carrying two copies that can drift.
      - name: stage the stores
        run: |
          mkdir -p android/app/src/main/assets
          missing=0
          for f in words.blob words.by_word words.by_id \
                   table3.btb table3.btb.idx grammar.tsv \
                   seth_el.raw seth_el.raw.u64 \
                   seth_el.post seth_el.post.idx; do
            if [ -f "$f" ]; then
              cp "$f" android/app/src/main/assets/
            else
              echo "MISSING: $f"; missing=1
            fi
          done
          ls -la android/app/src/main/assets/ || true
          # A BUILD THAT SHIPS WITHOUT THE STORES IS AN APP WITH NO
          # LANGUAGE. It would install and refuse to boot, which is
          # correct behaviour and a waste of everyone's time — so fail
          # here, where the reason is visible.
          if [ "$missing" = "1" ]; then
            echo "::error::stores are not in the repo; the apk would have no language"
            exit 1
          fi

      - name: build
        working-directory: android
        run: |
          gradle wrapper --gradle-version 8.9 --no-daemon
          ./gradlew assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: chassis-apk
          path: android/app/build/outputs/apk/release/*.apk

      # A RELEASE, SO IT IS A LINK RATHER THAN A LOGIN.
      - name: release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v9-${{ github.run_number }}
          name: Chassis v9 build ${{ github.run_number }}
          files: android/app/build/outputs/apk/release/*.apk
