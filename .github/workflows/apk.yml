name: apk

on:
  push:
    paths: ['android/**', '.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      # THE STORES ARE BUILT ARTIFACTS, NOT SOURCE.
      # They are generated on the python side and live at the repo root,
      # so the workflow stages them into assets rather than the repo
      # carrying two copies that can drift.
      - name: stage the stores
        run: |
          mkdir -p android/app/src/main/assets

          # REQUIRED. The language is genome and the grammar is a
          # holding; without either the app installs and refuses to
          # boot, which is correct behaviour and a waste of a download.
          missing=0
          for f in words.blob words.by_word words.by_id \
                   table3.btb table3.btb.idx grammar.tsv; do
            if [ -f "$f" ]; then cp "$f" android/app/src/main/assets/
            else echo "MISSING REQUIRED: $f"; missing=1; fi
          done

          # OPTIONAL. An archive is somebody's life and a core without
          # one is simply a core that HAS NOT LIVED YET — the normal
          # state of a new entity, not an error. The app already treats
          # these as optional; the workflow was failing the build on
          # them, and the two lists disagreeing is why build 17 died.
          for f in seth_el.raw seth_el.raw.u64 \
                   seth_el.post seth_el.post.idx; do
            if [ -f "$f" ]; then cp "$f" android/app/src/main/assets/
            else echo "no archive: $f (fine — it has not lived yet)"; fi
          done

          ls -la android/app/src/main/assets/ || true
          if [ "$missing" = "1" ]; then
            echo "::error::a required store is not in the repo"
            exit 1
          fi

      - name: build
        working-directory: android
        run: |
          gradle wrapper --gradle-version 8.9 --no-daemon
          ./gradlew assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: chassis-apk
          path: android/app/build/outputs/apk/release/*.apk

      # A RELEASE, SO IT IS A LINK RATHER THAN A LOGIN.
      - name: release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v9-${{ github.run_number }}
          name: Chassis v9 build ${{ github.run_number }}
          files: android/app/build/outputs/apk/release/*.apk
