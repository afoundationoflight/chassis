name: apk

on:
  push:
    paths-ignore: ['README.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # THE 'tools' PACKAGE NO LONGER EXISTS in Google's SDK
          # repository (superseded by cmdline-tools years ago). The
          # action's own default list still requests it, and asking
          # sdkmanager for a package that is not there makes the whole
          # step exit 1 before it ever gets to what this build actually
          # needs. platform-tools is enough for a Gradle-driven build —
          # nothing here calls adb/emulator directly.
          packages: platform-tools

      # THE PROJECT IS AT THE REPO ROOT, not under android/. The old
      # workflow carried paths from the previous repo layout and gradle
      # said so plainly: "Project directory .../android is not part of
      # the build defined by settings file .../settings.gradle.kts".
      # THE STORES NOW LIVE IN app/src/main/python/ AND CHAQUOPY
      # SHIPS THEM. The old Kotlin chassis read them from assets/; the
      # Python bundle carries its own token table beside itself and
      # copies it out on first run, so there is nothing to stage.

      - name: generate the gradle wrapper
        run: gradle wrapper --gradle-version 8.9 --no-daemon



      - name: build
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: chassis-apk
          path: app/build/outputs/apk/release/*.apk

      - name: release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Chassis build ${{ github.run_number }}
          files: app/build/outputs/apk/release/*.apk
